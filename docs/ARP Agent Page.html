<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ARP Agent Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0E0F10; --panel:#121314; --raised:#1B1D1F; --rule:#2E3134; --rule-strong:#43474B;
  --grey:#6B7075; --muted:#8A9096; --silver:#A9AEB2; --paper:#E6E8E6; --saffron:#FFB020; --alarm:#FF4D6D; --ink:#121314;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
:root:not([data-theme="light"]),:root[data-theme="dark"]{color-scheme:dark}
html,body{background:var(--ground);color:var(--paper)}
body{margin:0;font-family:var(--display);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--silver);text-decoration:none} a:hover{color:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 48px}
.mono{font-family:var(--mono)}

/* nav */
nav.main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;min-height:88px;border-bottom:1px solid var(--rule)}
nav .side{display:flex;gap:clamp(14px,3vw,40px);flex-wrap:wrap}
nav .left{justify-content:flex-end;padding-right:clamp(14px,4vw,48px)}
nav .right{justify-content:flex-start;padding-left:clamp(14px,4vw,48px)}
.item{display:flex;align-items:center;gap:10px;height:44px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.item i{width:6px;height:6px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule-strong)}
.item:hover{color:var(--paper)} .item:hover i{background:var(--paper);box-shadow:none}
.item[aria-current="page"]{color:var(--paper)} .item[aria-current="page"] i{background:var(--saffron);box-shadow:none}
.mark{width:56px;height:56px;display:block}

/* design-only bar */
.devbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;border:0;background:transparent;font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--paper)}
.grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* section grammar: rail on the left says what the claim cost */
.sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;padding:36px 0;border-top:1px solid var(--rule)}
.sec.free{border-top-style:dashed}
.rail{display:flex;flex-direction:column;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.rail .n{font-size:11px;color:var(--grey)}
.rail .t{color:var(--paper);letter-spacing:.08em}
.cost{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--rule-strong);align-self:flex-start;color:var(--silver)}
.cost i{width:7px;height:7px;border-radius:999px}
.cost.paid i{background:var(--paper)} .cost.paid{color:var(--paper);border-color:var(--paper)}
.cost.fact i{background:var(--paper);box-shadow:none;clip-path:inset(0 50% 0 0)} .cost.fact{border-color:var(--rule-strong)}
.cost.free i{box-shadow:inset 0 0 0 1.5px var(--grey)} .cost.free{color:var(--muted);border-style:dashed}
.cost.you i{background:var(--saffron)} .cost.you{color:var(--saffron);border-color:var(--saffron)}
.cost.meta i{background:var(--rule-strong)}
.chainline{color:var(--grey);font-size:10px}
.sec.free .body{color:var(--muted)}
.body{min-width:0;display:flex;flex-direction:column;gap:20px}

h1{margin:0;font-size:clamp(40px,5.6vw,76px);line-height:.94;font-weight:800;font-stretch:125%;letter-spacing:-.03em;overflow-wrap:anywhere}
h1.gen{color:var(--grey)}
.desc{margin:0;max-width:620px;font-size:16px;line-height:1.5;color:var(--muted)}
.desc.none{font-family:var(--mono);font-size:12px;color:var(--grey)}
.note{font-family:var(--mono);font-size:11px;color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:6px;border:1px dashed var(--rule-strong);font-family:var(--mono);font-size:11px;color:var(--silver);align-self:flex-start}
.regs{display:flex;gap:8px;flex-wrap:wrap}
.reg{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--rule);display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.reg.here{border-color:var(--rule-strong);color:var(--paper)}

/* header block */
.top{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:end;padding:56px 0 36px}
.who{display:flex;gap:20px;align-items:flex-start}
.ava{width:64px;height:64px;border-radius:999px;flex:none;border:1px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--panel)}
.who-txt{display:flex;flex-direction:column;gap:14px;min-width:0}
.ledger{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.ledger>div{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ledger>div+div{border-left:1px dashed var(--rule-strong)}
.ledger .h{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px}
.ledger .h i{width:7px;height:7px;border-radius:999px}
.ledger .paidcol .h i{background:var(--paper)} .ledger .freecol .h i{box-shadow:inset 0 0 0 1.5px var(--grey)}
.ledger .l{display:flex;flex-direction:column;gap:2px}
.ledger .paidcol strong{font-size:28px;line-height:1;font-weight:800;font-stretch:125%}
.ledger .freecol strong{font-size:17px;line-height:1.2;font-weight:600;color:var(--muted)}
.ledger span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ledger .freecol span{color:var(--grey)}

/* sigil */
.sig{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.legend b{font-weight:500;color:var(--silver)}
.lg{display:flex;align-items:center;gap:10px}
.lg i{width:9px;height:9px;border-radius:999px}
.lg i.h{box-shadow:inset 0 0 0 1.5px var(--muted)} .lg i.f{background:var(--paper)} .lg i.c{background:var(--saffron)}

/* 3: who used it */
.big2{display:flex;gap:48px;flex-wrap:wrap;align-items:flex-end}
.big2 div{display:flex;flex-direction:column;gap:8px}
.big2 strong{font-size:clamp(56px,7vw,96px);line-height:.85;font-weight:800;font-stretch:125%;letter-spacing:-.03em}
.big2 span{font-family:var(--mono);font-size:12px;color:var(--silver)}
.big2 .of strong{color:var(--silver)}
.tbl{border-top:1px solid var(--rule-strong)}
.tr{display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1fr) 150px 90px;gap:16px;align-items:center;min-height:60px;padding:0 8px;border-bottom:1px solid var(--rule)}
.tr.th{min-height:40px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted)}
.tr .num{justify-self:end;text-align:right}
.tr .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.tr .nm strong{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .nm strong.addr{font-family:var(--mono);font-size:14px;font-weight:500}
.tr .nm span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tr .via{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr .amt{font-family:var(--mono);font-size:14px;color:var(--paper)}
.tr .amt small{color:var(--muted);font-size:11px;margin-left:4px}
.tr .amt.unpaid{color:var(--grey);font-size:12px}
.tr .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr.me{background:var(--raised)}
.wallet{width:28px;height:28px;border-radius:6px;border:1px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--muted)}
.empty{padding:28px 0;font-family:var(--mono);font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule)}
.empty b{font-weight:500;color:var(--paper)}

/* 4: endpoints */
.ep{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:13px}
.ep .k{color:var(--muted);font-size:11px}
.ep .u{color:var(--silver);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.probe{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border:1px dashed var(--rule-strong);border-radius:6px;font-size:11px;color:var(--muted)}
.probe i{width:7px;height:7px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--grey)}
.states{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--grey)}
.states span{display:inline-flex;align-items:center;gap:8px}
.states i{width:7px;height:7px;border-radius:999px}

/* 5: posed */
.posed{display:flex;gap:56px;flex-wrap:wrap;align-items:flex-end}
.posed div{display:flex;flex-direction:column;gap:8px}
.posed strong{font-size:44px;line-height:.9;font-weight:800;font-stretch:125%;letter-spacing:-.02em}
.posed strong small{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:6px}
.posed strong.nob{font-size:28px;color:var(--muted)}
.posed span{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center}
.posed .mine strong{color:var(--saffron)}

/* 6: curve */
.curve{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px}
.chart{border:1px solid var(--rule);border-radius:12px;padding:16px 16px 10px;background:var(--panel)}
.chart svg{display:block;width:100%;height:auto}
.dist{display:flex;flex-direction:column;gap:14px}
.strip{display:flex;gap:2px;height:28px}
.strip i{display:block;height:100%;background:var(--rule-strong);border-radius:2px;min-width:2px}
.strip i.lead{background:var(--paper)} .strip i.you{background:var(--saffron)}
.facts{display:flex;flex-direction:column}
.facts div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--muted)}
.facts b{font-weight:500;color:var(--paper)}

/* 7: add to the record */
.acts{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr);gap:16px}
.act{border:1px solid var(--rule-strong);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;background:var(--panel)}
.act.primary{border-color:var(--saffron)}
.act h3{margin:0;font-size:22px;line-height:1;font-weight:800;font-stretch:125%}
.terms{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.terms div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11px;color:var(--muted)}
.terms b{font-weight:500;color:var(--paper)}
.terms b.warm{color:var(--saffron)}
.chips{display:flex;gap:8px}
.chip{flex:1;height:38px;border-radius:8px;border:1px solid var(--rule-strong);background:transparent;font-family:var(--mono);font-size:13px;color:var(--silver);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--saffron);color:var(--saffron)}
.btn{height:48px;border:0;border-radius:10px;background:var(--saffron);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px}
.btn.line{background:transparent;border:1px solid var(--rule-strong);color:var(--paper)}
.btn.line.warm{border-color:var(--saffron);color:var(--saffron)}
.btn.quiet{background:transparent;color:var(--muted);border:1px solid transparent}
.btn[disabled]{background:var(--raised);color:var(--muted);cursor:default;border:0}
.btn.done{background:transparent;border:1px solid var(--saffron);color:var(--saffron)}
.btnrow{display:flex;gap:8px}.btnrow .btn{flex:1}
.sline{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:16px}
.mt-auto{margin-top:auto}

/* 8: declared capabilities, quiet */
.caps{display:grid;grid-template-columns:140px minmax(0,1fr);border-top:1px dashed var(--rule)}
.caps>*{padding:10px 0;border-bottom:1px dashed var(--rule)}
.caps dt{font-family:var(--mono);font-size:11px;color:var(--grey)}
.caps dd{margin:0;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.qtag{height:22px;padding:0 8px;border-radius:6px;border:1px dashed var(--rule-strong);font-family:var(--mono);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.qtag i{width:7px;height:7px;border-radius:999px;box-shadow:inset 0 0 0 1.3px var(--muted)}

/* 9: assessor */
.asx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;border:1px dashed var(--rule-strong);border-radius:12px;padding:20px}
.asx .score{display:flex;align-items:baseline;gap:10px}
.asx .score strong{font-size:30px;font-weight:800;font-stretch:125%;color:var(--silver)}
.asx .score span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sig-ok{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--silver)}
.sig-ok i{width:7px;height:7px;border-radius:999px;background:var(--paper)}
.sig-bad{color:var(--alarm)} .sig-bad i{background:var(--alarm)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sidebox{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sidebox .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sidebox .c b{font-weight:500;color:var(--paper)}

/* 10: technical */
.techl{display:grid;grid-template-columns:160px minmax(0,1fr);border-top:1px solid var(--rule)}
.techl>*{padding:11px 0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12px}
.techl dt{color:var(--muted)}
.techl dd{margin:0;color:var(--silver);display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
.techl a{color:var(--paper);border-bottom:1px solid var(--rule-strong)}
.techl a:hover{border-color:var(--paper)}
.techl .ex{color:var(--grey);font-size:11px}

/* 11: gaps */
.gap{display:grid;grid-template-columns:22px 150px minmax(0,1fr);gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--silver)}
.gap .g{color:var(--muted);font-size:13px;line-height:1.2}
.gap .k{color:var(--muted)}

/* hint */
.hint{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:6px;border-radius:999px;border:1px solid var(--rule-strong);background:transparent;color:var(--muted);font-family:var(--mono);font-size:9px;cursor:help;vertical-align:middle;padding:0;flex:none}
.hint .tip{position:absolute;bottom:calc(100% + 8px);left:-8px;width:230px;padding:10px 12px;border-radius:8px;background:var(--raised);border:1px solid var(--rule-strong);color:var(--silver);font-family:var(--display);font-size:12px;line-height:1.45;letter-spacing:0;text-transform:none;text-align:left;opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .14s,transform .14s;z-index:5}
.hint .tip{display:none}
.hint:hover .tip,.hint:focus-visible .tip,.hint:focus .tip{display:block;opacity:1;transform:none}
@media (max-width:560px){.hint .tip{position:fixed;left:16px;right:16px;bottom:16px;top:auto;width:auto}}

/* loader and pulse */
@keyframes lit{0%,100%{fill:#2E3134}30%{fill:#FFB020}60%{fill:#43474B}}
.ldr circle{animation:lit 1.2s ease-in-out infinite}
@keyframes ring{0%{r:2;opacity:1}100%{r:40;opacity:0}}
.pulse{fill:none;stroke:var(--saffron);stroke-width:1.5;opacity:0}
.pulse.go1{animation:ring 1.1s ease-out}
@keyframes rowin{from{background:#2a2414}to{background:var(--raised)}}
.tr.me.fresh{animation:rowin 1.6s ease-out}

footer{margin-top:64px;border-top:1px solid var(--rule);padding-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}

@media (max-width:1100px){.top{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}.acts .act:last-child{grid-column:1/-1}.curve{grid-template-columns:1fr}}
@media (max-width:820px){
  .sec{grid-template-columns:1fr;gap:18px;padding:28px 0}
  .rail{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px}
  .asx{grid-template-columns:1fr}
  .tr{grid-template-columns:32px minmax(0,1fr) auto;row-gap:2px;padding:10px 4px}
  .tr .via,.tr .when{display:none}
  .tr.th .via,.tr.th .when{display:none}
}
@media (max-width:560px){
  .acts{grid-template-columns:1fr}
  .ledger{grid-template-columns:1fr}.ledger>div+div{border-left:0;border-top:1px dashed var(--rule-strong)}
  .who{flex-direction:column}
  .caps,.techl{grid-template-columns:1fr}.caps dt,.techl dt{border-bottom:0;padding-bottom:0}
  .gap{grid-template-columns:22px minmax(0,1fr)}.gap .k{grid-column:2}.gap .v{grid-column:2}
  .ep{grid-template-columns:56px minmax(0,1fr)}.ep .probe{grid-column:2;justify-self:start}
  .big2{gap:28px}.posed{gap:28px}
  .sides{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.ldr circle{animation:none;fill:#43474B}.pulse.go1,.tr.me.fresh{animation:none}}
</style>

<div class="wrap">
  <nav class="main" aria-label="Main">
    <div class="side left"><a class="item" href="#" aria-current="page"><i></i>AGENTS</a><a class="item" href="#modules"><i></i>MODULES</a></div>
    <a href="#top" aria-label="ARP home"><svg class="mark" viewBox="0 0 108 108" aria-hidden="true" id="navmark"></svg></a>
    <div class="side right"><a class="item" href="#sdk"><i></i>SDK</a><a class="item" href="#profile"><i></i>0x7A3F…C21E</a></div>
  </nav>

  <div class="devbar">
    <div class="grp"><span>NETWORK</span>
      <div class="seg" id="chain" role="group" aria-label="Network">
        <button type="button" data-v="testnet" aria-pressed="true">INTUITION TESTNET 13579</button>
        <button type="button" data-v="mainnet" aria-pressed="false">INTUITION MAINNET 1155</button>
      </div>
    </div>
    <div class="grp"><span>DESIGN SAMPLE</span>
      <div class="seg" id="sample" role="group" aria-label="Sample agent">
        <button type="button" data-v="documented" aria-pressed="true">DOCUMENTED</button>
        <button type="button" data-v="bare" aria-pressed="false">BARE</button>
      </div>
    </div>
  </div>

  <main id="page"></main>

  <footer>
    <span>Sample data · ARP publishes no score · every number is someone's deposit</span>
    <span>ERC-8004 · ERC-7710 · Intuition</span>
  </footer>
</div>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  // logo
  const nm=$('navmark');

  function strip(){
    const C=S[sample].chains[chain],box=$('strip');if(!box||!C.shares)return;
    const all=C.shares.slice();if(C.posed.mine)all.push(C.posed.mine/C.posed.amt*100);
    box.innerHTML=all.map((v,i)=>'<i class="'+(i===0?'lead':(C.posed.mine&&i===all.length-1?'you':''))+'" style="flex:'+v+'"></i>').join('');
  }

  // actions
  let amt=25;
  function wire(){
    const A=S[sample],C=A.chains[chain];
    usedRows(false);chart();strip();
    const big=$('bigsig');if(big)sigil(big,A.id,A.tools.map(t=>[t,'d']),C.posed.mine>0,true);

    // declare
    const dc=$('decl'),dl=$('decl-l');
    const already=C.used.some(u=>u.me);
    const dIdle=()=>{if(already||C.used.some(u=>u.me)){dc.innerHTML='<button class="btn done" type="button" disabled style="background:transparent;border:1px solid var(--saffron);color:var(--saffron)">You declared using it</button>';dl.textContent='Your claim is in section 03 · '+CHAIN[chain];return;}
      dc.innerHTML='<button class="btn" type="button">Declare use · 0.1 TRUST</button>';dl.textContent=CHAIN[chain];dc.firstChild.onclick=dAsk;};
    const dAsk=()=>{dc.innerHTML='<div class="btnrow"><button class="btn quiet" type="button">Cancel</button><button class="btn line warm" type="button">Pay 0.1 TRUST, not refundable</button></div>';
      dl.textContent='Your address '+ME+' is written on the record'+(chain==='mainnet'?', on mainnet.':'.');
      dc.querySelector('.quiet').onclick=dIdle;
      const go=dc.querySelector('.warm');go.focus();
      go.onclick=()=>{dc.innerHTML='<button class="btn" type="button" disabled>'+ringSvg(18)+'Writing the edge</button>';dl.textContent='One signature, then the triple is created.';
        setTimeout(()=>{C.used.unshift({w:ME,me:true,via:'used for · solidity-audit',amt:.10,when:'now'});
          const pu=C.used.filter(u=>u.amt!==null).length;
          render();usedRows(true);
          document.getElementById('s3').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});},1300);};};
    dIdle();

    // back
    const bc=$('back'),bl=$('back-l');
    $('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;amt=+b.dataset.v;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));bIdle();};
    const bIdle=()=>{bc.innerHTML='<button class="btn line warm" type="button" style="width:100%">Back it · '+amt+' TRUST</button>';bl.textContent='Within your delegation cap of 250 TRUST.';bc.firstChild.onclick=bGo;};
    const bGo=()=>{bc.innerHTML='<button class="btn" type="button" disabled style="width:100%">'+ringSvg(18)+'Confirming</button>';bl.textContent='Redeeming delegation, one signature.';
      setTimeout(()=>{if(!C.posed.mine)C.posed.acc+=1;C.posed.mine+=amt;C.posed.amt+=amt;if(C.curve)C.curve[C.curve.length-1]=C.posed.amt;
        render();const p=$('pulse');if(p)requestAnimationFrame(()=>p.classList.add('go1'));
        const b2=$('back');b2.innerHTML='<button class="btn done" type="button" style="width:100%">Backed · '+amt+' TRUST</button>';$('back-l').textContent='You hold '+fmt(C.posed.mine)+' TRUST here. Withdraw from your profile.';
        b2.firstChild.onclick=()=>wire();},1300);};
    bIdle();

    // take a side on the assessment
    [['side-b','back','Back the assessment'],['side-c','contest','Contest it']].forEach(([id,k,label])=>{
      const box=$(id);if(!box)return;
      const idle=()=>{box.innerHTML='<button class="btn line" type="button" style="width:100%;height:40px;font-size:13px">'+label+'</button>';box.firstChild.onclick=go;};
      const go=()=>{box.innerHTML='<button class="btn" type="button" disabled style="width:100%;height:40px;font-size:13px">'+ringSvg(16)+'Confirming</button>';
        setTimeout(()=>{C.sides[k][0]+=1;C.sides[k][1]+=10;render();},1200);};
      idle();
    });
  }

  function seg(id,set){const g=$(id);g.onclick=e=>{const b=e.target.closest('button');if(!b)return;[...g.children].forEach(x=>x.setAttribute('aria-pressed',x===b));set(b.dataset.v);render();};}
  seg('chain',v=>chain=v);seg('sample',v=>sample=v);
  render();
})();
</script>

</body></html>
