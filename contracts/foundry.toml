# Foundry configuration for ARP contracts.
# Chain target: Intuition Testnet (chainId 13579). See ../deployments/13579.json.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false

# Read-only access to ../deployments so scripts can resolve external addresses.
fs_permissions = [{ access = "read", path = "../deployments" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
intuition_testnet = "${INTUITION_TESTNET_RPC_URL}"

# Intuition Testnet's Blockscout-style explorer. Verification accepts an empty
# API key; set ETHERSCAN_API_KEY in .env if the explorer team issued one.
[etherscan]
intuition_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://testnet.explorer.intuition.systems/api", chain = 13579 }
