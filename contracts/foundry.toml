# Foundry configuration for ARP contracts.
# Chain target: Intuition Testnet (chainId 13579). See ../deployments/13579.json.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Per-file solc selection: ModuleRegistry uses ^0.8.24, but the vendored
# delegation-framework is pinned strict 0.8.23. auto_detect picks the right
# compiler per compilation unit so both can coexist.
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false

# Read-only access to ../deployments so scripts can resolve external addresses.
fs_permissions = [{ access = "read", path = "../deployments" }]

# Remappings for the delegation-framework consumption chain. The framework
# itself depends on @account-abstraction, @erc7579, @openzeppelin/contracts,
# @bytes-utils, @solidity-stringutils — all of which it bundles under
# lib/delegation-framework/lib/. Our enforcers import from
# delegation-framework/src/* via these remappings.
#
# The framework's crypto sub-libs (FCL/FreshCryptoLib/SCL) and its own test/
# directory are NOT vendored — they ship broken transitive node_modules
# (Truffle/Hardhat fixtures) that don't compile under our solc. They are
# not needed for DomainScopeEnforcer or TrustStakeCapEnforcer (we don't use
# advanced signature schemes or run delegation-framework's own tests).
remappings = [
    "@account-abstraction/=lib/delegation-framework/lib/account-abstraction/contracts/",
    "@erc7579/=lib/delegation-framework/lib/erc7579-implementation/src/",
    "@openzeppelin/contracts/=lib/delegation-framework/lib/openzeppelin-contracts/contracts/",
    "@bytes-utils/=lib/delegation-framework/lib/solidity-bytes-utils/contracts/",
    "@solidity-stringutils/=lib/delegation-framework/lib/solidity-stringutils/src/",
    "delegation-framework/=lib/delegation-framework/src/",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
intuition_testnet = "${INTUITION_TESTNET_RPC_URL}"

# Intuition Testnet's Blockscout-style explorer. Verification accepts an empty
# API key; set ETHERSCAN_API_KEY in .env if the explorer team issued one.
[etherscan]
intuition_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://testnet.explorer.intuition.systems/api", chain = 13579 }
