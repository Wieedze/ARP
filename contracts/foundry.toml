# Foundry configuration for ARP contracts.
# Chain target: Intuition Testnet (chainId 13579). See ../data/deployments/13579.json.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Per-file solc selection: ModuleRegistry uses ^0.8.24, but the vendored
# delegation-framework is pinned strict 0.8.23. auto_detect picks the right
# compiler per compilation unit so both can coexist.
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false

# Read-only access to ../data/deployments so scripts can resolve external addresses.
fs_permissions = [{ access = "read", path = "../data/deployments" }]

# Both libs are git submodules, pinned in ../.gitmodules and the index:
# delegation-framework at main 1bdb8a3be3027f80c09d984ee403053d534fce48
# (2026-05-29 — after the v1.3.0 tag the on-chain DelegationManager was deployed
# from), forge-std at b3bc8b154382a75d0b0ef22d7fd4a0a5f0feee0e. `bun run deps`
# fetches them; a clean clone does not build without it.
#
# The framework depends on @account-abstraction, @erc7579,
# @openzeppelin/contracts, @bytes-utils, @solidity-stringutils — its own nested
# submodules under lib/delegation-framework/lib/. `bun run deps` initialises
# those five plus its forge-std, and leaves out its crypto sub-libs (FCL,
# FreshCryptoLib, SCL): nothing here imports them and they pull ~500 MB. forge
# compiles only what src/, test/ and script/ reach, so the framework's own
# test/ directory, which does not compile under our remappings, is never built.
remappings = [
    "@account-abstraction/=lib/delegation-framework/lib/account-abstraction/contracts/",
    "@erc7579/=lib/delegation-framework/lib/erc7579-implementation/src/",
    "@openzeppelin/contracts/=lib/delegation-framework/lib/openzeppelin-contracts/contracts/",
    "@bytes-utils/=lib/delegation-framework/lib/solidity-bytes-utils/contracts/",
    "@solidity-stringutils/=lib/delegation-framework/lib/solidity-stringutils/src/",
    "delegation-framework/=lib/delegation-framework/src/",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
intuition_testnet = "${INTUITION_TESTNET_RPC_URL}"

# Intuition Testnet's Blockscout-style explorer. Verification accepts an empty
# API key; set ETHERSCAN_API_KEY in .env if the explorer team issued one.
[etherscan]
intuition_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://testnet.explorer.intuition.systems/api", chain = 13579 }
